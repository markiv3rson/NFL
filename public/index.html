  .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:10px; }
  .stat { background:var(--card); border:1px solid rgba(255,255,255,.28); border-radius:16px; padding:10px 8px; text-align:center; }
  .stat .k { font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--faint); text-transform:none; } .stat .v { font-size:19px; font-weight:800; margin-top:2px; } .stat .k2 { font-size:10px; color:var(--faint); }
  #panel-lab .stat { border-color:rgba(183,148,255,.6); }
  .arow { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line2); font-size:13px; } .arow .nm { flex:1; font-weight:600; } .arow .rc { font-size:11px; } .arow b { width:40px; text-align:right; }
  .pbars { display:flex; gap:3px; align-items:flex-end; height:64px; margin-top:10px; } .pb { flex:1; display:flex; flex-direction:column; justify-content:flex-end; } .pb i { display:block; width:100%; border-radius:3px; }
  .pyrs { display:flex; gap:3px; margin-top:4px; } .pyrs span { flex:1; text-align:center; font-size:8px; color:var(--faint); }
  .price-link { cursor:pointer; border-bottom:1px dotted var(--faint); }

</head>
<body>
<div class="pagewm" id="bgwm"></div>
<div class="wrap">
  <div class="hero">
    <div><div class="wk" id="hero-wk">WEEK</div><h1>NFL Slate</h1><div class="upd" id="hero-upd">Loading…</div></div>
    <div class="cd"><div class="cdl">NEXT KICKOFF</div>
      <div class="cdn"><div><b id="cd-d">--</b><i>DAYS</i></div><span>:</span><div><b id="cd-h">--</b><i>HRS</i></div><span>:</span><div><b id="cd-m">--</b><i>MINS</i></div><span>:</span><div><b id="cd-s">--</b><i>SECS</i></div></div>
      <div class="cdg" id="cd-g"></div></div>
  </div>
  <div class="tabrow">
    <div class="tabs">
      <button data-tab="lines" class="on">Game Lines</button>
      <button data-tab="td">Anytime TD</button>
      <button data-tab="lab">Pick Lab</button>
      <button data-tab="record">Record</button>
    </div>
    <button class="bell" id="bell" aria-label="Alerts"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="cnt" id="bell-cnt"></span></button>
  </div>
  <div id="weekline" style="display:none"></div>

  <div class="panel on" id="panel-lines"><div id="lines"></div><div id="detail" style="display:none"></div></div>
  <div class="panel" id="panel-td"><div id="td-header" class="sub" style="margin-top:12px">Anytime TD</div><div id="td"></div></div>
  <div class="panel" id="panel-lab">
    <div class="banner"><b>MODEL ONLY</b><span>The model's own picks, tracked so it can learn. Not bets.</span></div>
    <div class="sw" id="labsw"><button data-lv="picks" class="on">Picks</button><button data-lv="results">Results</button></div>
    <div id="lab"></div><div id="lab-results" style="display:none"></div>
  </div>
  <div class="panel" id="panel-record">
    <div class="sub" style="margin-top:12px;font-weight:800;letter-spacing:.08em">YOUR BETS ONLY · REAL MONEY</div>
    <div id="record-mine"></div>
  </div>
  <div class="panel" id="panel-alerts">
    <div class="center" style="text-align:left;margin-top:12px"><span style="font-size:24px;font-weight:800">Alerts</span> <button class="tag" id="al-read" style="float:right;margin-top:6px">Mark all read</button></div>
    <div class="chips" id="al-chips"></div>
    <div id="alerts"></div>
  </div>
</div>
<div class="fab">
  <div id="toast" class="toast"></div>
  <div class="fb"><button id="refresh-btn" aria-label="Refresh lines and injuries"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4M4 5v4h4M4 13a8 8 0 0 0 14 4M20 19v-4h-4"/></svg>Lines</button></div>
  <div class="fb"><button id="rerun-btn" aria-label="Rerun model"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Model</button></div>
</div>
<script src="/app.js"></script>
</body>
</html>
