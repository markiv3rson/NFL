<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFL SLATEZZZ</title>
<style>
  :root { --bg:#000; --card:#1f1f23; --card2:#18181b; --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.08);
    --text:#ececef; --dim:#a1a1aa; --faint:#8a8a93; --red:#ff4d5e; --green:#4ade80; --yellow:#ffd166; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .wrap { max-width:980px; margin:0 auto; padding:16px 12px 140px; }
  h1 { font-size:22px; font-weight:700; letter-spacing:.08em; margin:4px 2px 0; }
  .tabs { display:flex; gap:7px; margin:14px 0 0; }
  .tabs button, .sw button { flex:1; font:inherit; font-size:13px; font-weight:600; padding:9px 4px; border-radius:4px; cursor:pointer;
    color:var(--dim); background:var(--card2); border:1px solid rgba(255,255,255,.16); white-space:nowrap; }
  .tabs button.on, .sw button.on { color:#fff; background:rgba(255,77,94,.30); border:1.5px solid var(--red); animation:glow 2.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow:0 0 10px 1px rgba(255,77,94,.55); } 50% { box-shadow:0 0 3px 0 rgba(255,77,94,.15); } }
  .weekline { font-size:11.5px; color:var(--faint); margin:9px 2px 4px; }
  .panel { display:none; } .panel.on { display:block; }
  .grid { display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
  @media (min-width:900px) { .grid.two { grid-template-columns:1fr 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; position:relative; overflow:hidden; }
  .card.fin { border-color:rgba(255,77,94,.7); }
  .gh { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15.5px; font-weight:600; }
  .badge { font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:4px; border:1px solid rgba(255,255,255,.25); color:#c9c9cf; }
  .sub { font-size:12px; color:var(--faint); margin-top:2px; }
  .k { font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; }
  .f { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px; margin-top:10px; font-size:14px; }
  .hd { font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--faint); border-bottom:1px solid var(--faint); padding-bottom:3px; }
  .hd.hm { color:var(--green); border-color:var(--green); }
  .prl { display:flex; justify-content:space-between; gap:8px; margin-top:2px; }
  .prl.mt { margin-top:6px; }
  .s { font-size:11.5px; color:var(--faint); margin-top:2px; }
  .btns { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  .tag { font:inherit; font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:4px; border:1px solid rgba(255,255,255,.22); color:#c9c9cf; background:transparent; cursor:pointer; }
  .drop { display:none; margin-top:10px; border-top:1px solid var(--line2); padding-top:8px; font-size:12.5px; }
  .drop.open { display:block; }
  .drow { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .g { color:var(--green); } .r { color:var(--red); } .y { color:var(--yellow); } .dim { color:var(--faint); }
  .pill { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 10px; border-radius:999px; border:1px solid; }
  .p-g { color:var(--green); border-color:var(--green); background:rgba(74,222,128,.10); }
  .p-y { color:var(--yellow); border-color:var(--yellow); background:rgba(255,209,102,.10); }
  .p-r { color:var(--red); border-color:var(--red); background:rgba(255,77,94,.10); }
  .p-n { color:var(--dim); border-color:rgba(255,255,255,.25); }
  .warn { font-size:12px; color:var(--yellow); margin-top:6px; }
  .live { width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; margin-right:4px; vertical-align:1px; }
  .cover { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center;
    background:rgba(255,77,94,.13); padding:10px; }
  .cover b { color:var(--red); font-size:15px; letter-spacing:.08em; }
  .fin .inner { opacity:.22; }
  .sec { padding:10px 0 8px; border-top:1px solid rgba(255,255,255,.10); } .sec:first-child { border-top:none; padding-top:2px; }
  .sh { font-size:12.5px; font-weight:600; color:#ff8a95; letter-spacing:.04em; margin-bottom:4px; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:4px 0; }
  .fold { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:10px 0; border-top:1px solid rgba(255,255,255,.10); cursor:pointer; }
  .sw { display:flex; gap:7px; margin-top:12px; }
  .center { text-align:center; margin-top:14px; }
  .btn { font:inherit; font-size:13px; font-weight:600; padding:9px 18px; border-radius:4px; border:1px solid rgba(255,255,255,.22); color:#c9c9cf; background:var(--card2); cursor:pointer; }
  .controls { display:flex; gap:7px; margin-top:12px; }
  .controls button { font:inherit; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:4px; border:1px solid rgba(255,255,255,.16); color:var(--dim); background:var(--card2); cursor:pointer; }
  .controls button.on { color:#fff; border-color:var(--red); background:rgba(255,77,94,.30); }
  .prow { display:grid; grid-template-columns:1fr auto auto; gap:2px 14px; align-items:center; padding:8px 9px; border-radius:8px; background:#141417; border:1px solid var(--line2); margin-top:6px; }
  .prow .n { text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:14px; max-width:38vw; }
  .prow .n .s { white-space:normal; text-align:right; }
  .prow .big { display:block; font-size:22px; font-weight:500; }
  .prow .px { display:block; font-size:18px; color:#a1a1aa; }
  .prow .lbl { display:block; font-size:11px; color:var(--faint); line-height:1.3; white-space:normal; }
  .prow .why { grid-column:1/-1; font-size:11.5px; color:var(--faint); }
  .prow .colhead { display:block; font-size:10px; color:var(--faint); margin-bottom:2px; font-weight:400; }
  .prow .logo { width:22px; height:22px; vertical-align:-6px; margin-right:6px; background:none; }
  .teams { display:grid; grid-template-columns:1fr; gap:12px; margin-top:8px; }
  @media (min-width:700px) { .teams { grid-template-columns:1fr 1fr; } }
  .pos { font-size:10px; font-weight:600; padding:0 5px; border-radius:4px; border:1px solid rgba(255,255,255,.2); color:#c9c9cf; margin-left:5px; }
  .fab { position:fixed; right:max(14px,env(safe-area-inset-right)); bottom:max(14px,env(safe-area-inset-bottom)); z-index:50; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .fab-row { display:flex; gap:8px; padding:7px; border-radius:10px; background:rgba(24,24,27,.8); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .fab button { font:inherit; font-size:12.5px; font-weight:600; padding:9px 13px; border-radius:4px; color:#fff; background:var(--card2); border:1px solid rgba(255,77,94,.6); cursor:pointer; }
  .fab button:disabled { opacity:.5; }
  .toast { max-width:290px; font-size:12px; line-height:1.45; padding:9px 12px; border-radius:8px; background:rgba(31,31,35,.95); border:1px solid var(--line); display:none; }
  .toast.show { display:block; }
  .price-link { cursor:pointer; border-bottom:1px dotted var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <h1>NFL SLATEZZZ</h1>
  <div class="tabs">
    <button data-tab="lines" class="on">Game Lines</button>
    <button data-tab="totals">Totals</button>
    <button data-tab="td">Anytime TD</button>
    <button data-tab="record">Record</button>
  </div>
  <div id="weekline" class="weekline">Loading…</div>

  <div class="panel on" id="panel-lines"><div id="lines" class="grid two"></div></div>
  <div class="panel" id="panel-totals"><div id="totals" class="grid two"></div></div>
  <div class="panel" id="panel-td">
    <div class="controls"><button data-sort="likely" class="on">Likely</button><button data-sort="game2">Top 2</button><button data-sort="game1">Top 1</button></div>
    <div class="weekline" style="margin-top:8px" id="td-header">Anytime TD</div>
    <div id="td"></div>
  </div>
  <div class="panel" id="panel-record">
    <div class="sw"><button data-view="mine" class="on">Mine</button><button data-view="model">Model</button></div>
    <div id="record-mine"></div>
    <div id="record-model" style="display:none"></div>
  </div>
</div>
<div class="fab">
  <div id="toast" class="toast"></div>
  <div class="fab-row"><button id="refresh-btn">↻ Lines + injuries</button><button id="rerun-btn">▶ Rerun model</button></div>
</div>
<script src="/app.js"></script>
</body>
</html>
